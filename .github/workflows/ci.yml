name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. These workflows only read the repository — none of them
# comment, push, or open anything — so the token they get should not be able
# to either. A public repo's default token permissions are broader than that,
# and a workflow that cannot write is a workflow that cannot be turned into a
# way to write.
permissions:
  contents: read

jobs:
  # ── Lint + format ──────────────────────────────────────────────────────────
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ── Tests ──────────────────────────────────────────────────────────────────
  # Runs the full pipeline against a throwaway Postgres: build the synthetic
  # fixture, load it through the same script that loads real data, then run
  # every contract and metric test against the result.
  #
  # Testing against synthetic data is the point, not a shortcut. A suite that
  # only ever sees one checked-in snapshot cannot tell you whether the metric
  # code is correct or merely tuned to that snapshot. And because the loader
  # is the same one used in production, the CHECK constraints in the DDL are
  # exercised on every push.
  test:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talent_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talent_market

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build synthetic fixture
        run: python scripts/make_fixture.py

      - name: Load into Postgres
        run: python scripts/load_to_postgres.py --fixture

      - name: Run tests
        run: pytest -q

      - name: Show query plans
        run: python scripts/explain_queries.py
