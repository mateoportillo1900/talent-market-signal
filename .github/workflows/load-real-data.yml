name: Load real data

# Loads a prebuilt dataset into Neon.
#
# NOTE: this cannot build from BLS. Measured on this workflow — BLS returns 403
# to every request from a GitHub runner while O*NET serves fine from the same
# machine in the same second, with a browser User-Agent and a ranged GET both
# tried. BLS blocks datacenter IP ranges, which rules out every cloud runner.
# See docs/DATA_QUALITY.md.
#
# So the build step runs on a residential connection and the Parquet is
# committed; this workflow loads it. The load half was never the problem.
#
# Manual only. It replaces the contents of the mart, so it should be a
# deliberate act, not something a push triggers by accident.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only verify the source URLs, download nothing"
        type: boolean
        default: false
      run_tests:
        description: "Run the full test suite against the loaded data"
        type: boolean
        default: true

# Least privilege. These workflows only read the repository — none of them
# comment, push, or open anything — so the token they get should not be able
# to either. A public repo's default token permissions are broader than that,
# and a workflow that cannot write is a workflow that cannot be turned into a
# way to write.
permissions:
  contents: read

jobs:
  load:
    name: Build and load
    runs-on: ubuntu-latest
    # BLS serves these files slowly. The default 6h cap is far more than
    # needed, but a stuck download should not burn an hour before failing.
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check the secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            echo "Add it at Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          # Never printed: this repo is public, so workflow logs are too.
          echo "DATABASE_URL is set (value withheld)"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Ten seconds of checking beats ten minutes of downloading into a 404.
      # BLS reorganises its paths between vintages, and when it does, this step
      # names the URL that moved.
      - name: Verify the source URLs
        # Informational when the dataset is already committed: BLS will 403
        # from this runner regardless, and that does not block the load.
        continue-on-error: true
        run: python scripts/build_dataset.py --check

      - name: Stop here if check-only
        if: ${{ inputs.check_only }}
        run: |
          echo "check_only was set — sources verified, nothing downloaded."
          exit 0

      # ~150 MB of federal flat files. Caching them means a re-run after a
      # parsing fix costs seconds rather than another full download.
      - name: Restore cached downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: bls-onet-${{ hashFiles('scripts/sources.py') }}
          restore-keys: bls-onet-

      # Only if the committed Parquet is absent. On a cloud runner this will
      # fail at the BLS 403 and say why — see the note at the top of this file.
      - name: Build the dataset
        run: |
          if [ -f data/talent_market.parquet ]; then
            echo "Using the committed dataset — skipping the download."
          else
            python scripts/build_dataset.py
          fi

      - name: Load into Neon
        run: python scripts/load_to_postgres.py

      - name: Run the test suite against real data
        if: ${{ inputs.run_tests }}
        run: pytest -q

      # The same Parquet the build produced, so it can be inspected or
      # committed without re-running the download.
      - name: Upload the built dataset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: talent-market-parquet
          path: data/*.parquet
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Real data load"
            echo ""
            if [ -f data/talent_market.parquet ]; then
              python - <<'PY'
          import pandas as pd
          t = pd.read_parquet("data/talent_market.parquet")
          s = pd.read_parquet("data/skills.parquet")
          print(f"- **{len(t):,}** occupation x metro facts")
          print(f"- **{t['soc_code'].nunique()}** occupations across "
                f"**{t['area_code'].nunique()}** metros")
          print(f"- **{len(s):,}** skill ratings")
          print("")
          print("The app's synthetic-data banner should now be gone.")
          PY
            else
              echo "No dataset produced — see the failing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
